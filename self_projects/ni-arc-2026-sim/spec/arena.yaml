# Single source of truth for arena geometry.
# Derived from: NI ARC 2026 Rule Book v1.0 (2026-05-04).
# All linear dimensions in METRES, angles in DEGREES.
#
# Coordinate convention (matches rulebook page-11 dimension diagram):
#   origin = floor centre of field
#   +X = horizontal axis perpendicular to team line (right when looking from above)
#   +Y = "Blue side" direction (Blue goal at +Y / top, Red goal at -Y / bottom)
#   +Z = up
#
# Tolerance: rulebook §Dimensions says ±0.02 m on everything.

field:
  size_xy_m: [6.0, 6.0]      # 6 m × 6 m playable area
  flooring_color: "#E8E2D6"  # warm off-white banner-material tint (lets coloured zones read)
  perimeter_pipe_od_m: 0.021 # 15 mm nominal PVC ≈ 21 mm outer diameter
  line_width_m: 0.025        # 25 mm boundary line width
  match_area_xy_m: [9.0, 9.0]  # hazard envelope; not collidable, just informational

teams:
  red:
    line_color:           "#FF0000"
    starting_zone_color:  "#FF9999"
    starting_base_color:  "#FF6666"
  blue:
    line_color:           "#0000FF"
    starting_zone_color:  "#99CCFF"
    starting_base_color:  "#6666FF"

# Three 2-m-deep strips running across the 6-m width.
# Each team's NEAR strip contains their own goal (they shoot at their assigned goal).
# Red's NEAR == Blue's FAR (and vice versa).
zones:
  blue_near:  {x: [-3.0,  3.0], y: [ 1.0,  3.0]}   # top strip (per rulebook diagram)
  mid:        {x: [-3.0,  3.0], y: [-1.0,  1.0]}
  red_near:   {x: [-3.0,  3.0], y: [-3.0, -1.0]}   # bottom strip

  # Shared ball zone — 2 m × 2 m centred in MID, light yellow.
  shared_ball:
    x: [-1.0, 1.0]
    y: [-1.0, 1.0]
    color: "#E2C884"

  # Starting zones — 70 cm wide × 2 m deep, on the sides of MID.
  # Rulebook is silent on which team is on which side; we put Red on -X (left).
  red_starting:
    x: [-3.0, -2.3]
    y: [-1.0,  1.0]
  blue_starting:
    x: [ 2.3,  3.0]
    y: [-1.0,  1.0]

# Each team has one starting base inside their starting zone — robot starts ItB.
# Rulebook doesn't pin the base size; we assume robot footprint (0.7 m × 0.7 m).
starting_bases:
  red:
    x: [-3.0, -2.3]
    y: [-0.35, 0.35]
  blue:
    x: [ 2.3, 3.0]
    y: [-0.35, 0.35]

# GOAL STRUCTURE: 2.0 m × 0.6 m × 1.5 m plywood with 6 circular openings.
# Six openings = 2 rows × 3 columns, each 0.40 m diameter.
# Heights given to bottom edge of opening.
goal:
  size_xyz_m: [2.0, 0.6, 1.5]
  wall_thickness_m: 0.015   # 15 mm plywood
  opening_diameter_m: 0.40
  low_row_bottom_m:   0.50
  high_row_bottom_m:  1.00
  # X positions are opening CENTRES, measured from the goal's local centre line.
  # Centre-to-centre spacing = 20 cm + 40 cm = 60 cm.
  opening_xs_m: [-0.60, 0.0, 0.60]
  face_geometry: "mesh"   # v0.2: proper circular openings via triangulated mesh
                          # generated by scripts/make_goal_face_mesh.py.
  material_color: "#A0522D"             # plywood brown
  # Where each goal stands. Front face faces the centre of the field.
  # Local goal frame: back panel at local +Y, front face (with openings) at local -Y.
  # Blue goal centre at world (0, +2.7): yaw=0 → local -Y maps to world -Y → front
  # faces field centre. Red goal centre at world (0, -2.7): yaw=180 → local -Y maps
  # to world +Y → front faces field centre.
  blue_goal_centre_xy: [0.0,  2.7]
  blue_goal_yaw_deg:    0
  red_goal_centre_xy:  [0.0, -2.7]
  red_goal_yaw_deg:    180

# BALLS: foam, spherical. Rulebook does not specify mass; using estimated values from
# typical commercial foam basketballs of these diameters. Replace with measured values.
balls:
  standard:
    count_in_shared_zone: 36
    count_preloaded_per_team: 2
    diameter_m: 0.18
    mass_kg: 0.150       # ESTIMATE — replace with measured value
    color: "#E07020"     # orange
    # Restitution (CoR) and friction baseline; calibrate in P3.
    restitution: 0.55
    friction_slide: 1.2
  golden:
    count_per_team: 10
    diameter_m: 0.21
    mass_kg: 0.220       # ESTIMATE — replace with measured value
    color: "#F4C030"     # bright yellow
    restitution: 0.55
    friction_slide: 1.2

# Physics defaults; refine in P3/P4 calibration.
physics:
  gravity_mps2:   [0.0, 0.0, -9.81]
  air_density_kgm3: 1.225        # for the drag plugin if/when we add it
  floor_friction_slide: 0.9      # banner-material smooth: lower than carpet
  floor_restitution: 0.30
  timestep_s: 0.005              # 200 Hz physics; control loop will run at ≤ 100 Hz
  integrator: "implicitfast"
